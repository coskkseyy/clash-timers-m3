name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PclashtimersSigning=$GITHUB_WORKSPACE/signing/keystore.properties

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ClashTimers-M3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimers-M3
          path: ClashTimers-M3.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clash Timers M3 (latest build)
          prerelease: true
          make_latest: true
          files: ClashTimers-M3.apk
