name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The signing key lives in repository secrets, never in the repo:
      #   KEYSTORE_B64   = base64 of the .jks file
      #   KEYSTORE_PROPS = the keystore.properties text (storePassword, keyAlias, keyPassword)
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PROPS: ${{ secrets.KEYSTORE_PROPS }}
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign/release.jks"
          printf '%s\n' "$KEYSTORE_PROPS" | grep -v '^storeFile=' > "$RUNNER_TEMP/sign/keystore.properties"
          echo "storeFile=$RUNNER_TEMP/sign/release.jks" >> "$RUNNER_TEMP/sign/keystore.properties"

      - name: Build signed release APK
        run: ./gradlew assembleRelease -PclashtimersSigning=$RUNNER_TEMP/sign/keystore.properties

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ClashTimer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimer
          path: ClashTimer.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clash Timer (latest build)
          prerelease: true
          make_latest: true
          files: ClashTimer.apk
